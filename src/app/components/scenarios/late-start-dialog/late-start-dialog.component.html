<crucible-dialog dialogTitle="Start Scenario" [hideDefaultActions]="true">
  <p crucibleDialogContent>{{ message }}</p>
  <ng-container crucibleDialogActions>
    <button matButton="outlined" type="button" (click)="close()">Cancel</button>
    @if (!endPassed) {
      <button matButton="outlined" type="button" (click)="close('end')">
        Start, end at {{ plannedEnd }}
      </button>
    }
    <button
      matButton="filled"
      type="button"
      cdkFocusInitial
      (click)="close('keep')"
    >
      Start and keep {{ plannedLength }}
    </button>
  </ng-container>
</crucible-dialog>
