<crucible-dialog
  dialogTitle="Export Scenario Templates"
  submitLabel="Export"
  loadingLabel="Exporting..."
  [loading]="loading"
  [errorMessage]="errorMessage"
  [submitDisabled]="data.ids.length === 0"
  (cancel)="cancel()"
  (submit)="export()"
>
  <div crucibleDialogContent class="dialog-fields">
    <p class="export-count">
      @if (data.ids.length === 0) {
        There are no Scenario Templates to export.
      } @else {
        {{ data.selected ? 'Selected' : 'All' }} Scenario Templates:
        {{ data.ids.length }}
      }
    </p>
    <p>
      The Scenario Templates are saved as a .json file, with their Tasks and VM
      Credentials. VM Credential passwords are included.
    </p>
  </div>
</crucible-dialog>
